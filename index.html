<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://coke-recap.vercel.app/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1B1B" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Tarang Jammalamadaka — Global Human Insights Intern @ Coca-Cola. Interactive 3D portfolio." />
    <meta name="author" content="Tarang Jammalamadaka" />
    <meta name="apple-mobile-web-app-title" content="Coke-Recap" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Coke-Recap — Tarang Jammalamadaka</title>

    <!-- Start the big GLB downloads at HTML parse instead of after the JS
         chunk arrives. crossorigin matches three's FileLoader fetch mode
         (cors + same-origin credentials) so the preload cache HITS — a
         mismatch would double-download; the screenshot suite asserts one
         fetch per model. -->
    <link rel="preload" href="/assets/models/coca-cola-diorama.glb" as="fetch" crossorigin />
    <link rel="preload" href="/assets/models/cocacola-bottle.glb" as="fetch" crossorigin />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coke-Recap" />
    <meta property="og:url" content="https://coke-recap.vercel.app/" />
    <meta property="og:title" content="Coke-Recap — Tarang Jammalamadaka" />
    <meta property="og:description" content="An interactive 3D recap of a Global Human Insights internship at Coca-Cola — step into 1886 Atlanta, Jacobs' Pharmacy, and the soda fountain where it all began." />
    <meta property="og:image" content="https://coke-recap.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Coca-Cola contour bottle freshly dispensed from a vintage vending machine in 1886 Atlanta, beside the internship recap intro." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coke-Recap — Tarang Jammalamadaka" />
    <meta name="twitter:description" content="An interactive 3D recap of a Global Human Insights internship at Coca-Cola — step into 1886 Atlanta where it all began." />
    <meta name="twitter:image" content="https://coke-recap.vercel.app/og-image.jpg" />

    <!-- Structured data — Person + WebSite for rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "name": "Tarang Jammalamadaka",
            "jobTitle": "Global Human Insights Intern",
            "worksFor": { "@type": "Organization", "name": "The Coca-Cola Company" },
            "url": "https://coke-recap.vercel.app/",
            "sameAs": [
              "https://github.com/tarang-tj",
              "https://www.linkedin.com/in/tarang-jammalamadaka/"
            ]
          },
          {
            "@type": "WebSite",
            "name": "Coke-Recap",
            "url": "https://coke-recap.vercel.app/"
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui; color: #fffef6; padding: 2rem; max-width: 36rem">
        Coke-Recap is an interactive 3-D portfolio by Tarang Jammalamadaka —

        <a href="mailto:tarangjammalamadaka9@gmail.com" style="color: #f40009">
          tarangjammalamadaka9@gmail.com</a
        >.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
